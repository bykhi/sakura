<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <img class="header-img" src="images/logo.jpg" alt="" />
    </header>
    <div class="main-visual">
      <picture>
        <source media="(max-width: 768px)" srcset="images/main-visual-sp.jpg" />
        <img src="images/main-visual-pc.jpg" alt="ロゴ" />
      </picture>
    </div>
    <nav>
      <ul class="nav-list">
        <li><a href="" class="nav-item">menu</a></li>
        <li><a href="" class="nav-item">blog</a></li>
        <li><a href="" class="nav-item">access</a></li>
      </ul>
    </nav>
    <div class="concept">
      <div class="inner">
        <div class="concept-left">
          <img src="images/concept.jpg" alt="" class="concept-images" />
        </div>
        <div class="concept-right">
          <p class="concept-text">Concept</p>
          <h3 class="concept-heading">心静かにコーヒーを</h3>
          <p class="concept-discription">
            立ち止まって、<br />
            空の青さを眺めて、<br />
            一息つきましょう
          </p>
        </div>
      </div>
    </div>
    <div class="blog-post">
      <h2 class="blog-title-en">blog</h2>
      <p class="blog-title-jp">ブログ</p>
    </div>
    <div class="container inner">
      <div class="item">
        <img src="images/thumbnail01.jpg" alt="" />
        <h3 class="menu">コーヒーカー始めました。</h3>
        <p class="day">2030.08.08</p>
      </div>
      <div class="item">
        <img src="images/thumbnail02.jpg" alt="" />
        <h3 class="menu">濃厚クリーミーなミルクをどうぞ</h3>
        <p class="day">2030.08.05</p>
      </div>
      <div class="item">
        <img src="images/thumbnail03.jpg" alt="" />
        <h3 class="menu">
          Sky Coffeeのオリジナル曲が完成!無料ダウン ロード可能です。
        </h3>
        <p class="day">2030.08.02</p>
      </div>
      <div class="item">
        <img src="images/thumbnail04.jpg" alt="" />
        <h3 class="menu">ハイキング用のコーヒーを販売中です。</h3>
        <p class="day">2030.07.28</p>
      </div>
      <div class="item">
        <img src="images/thumbnail05.jpg" alt="" />
        <h3 class="menu">ショップの壁を塗ってみました。</h3>
        <p class="day">2030.07.27</p>
      </div>
      <div class="item">
        <img src="images/thumbnail06.jpg" alt="" />
        <h3 class="menu">ブログをはじめました。</h3>
        <p class="day">2030.07.26</p>
      </div>
    </div>
    <div class="button-container">
      <a href="" class="blog-button">ブログ一覧</a>
    </div>
    <footer>
      <div class="footer-box">
        <img class="footer-img" src="images/logo-white (2).jpg" alt="" />
      </div>
      <p class="footer-container">&copy;SKy Coffee</p>
    </footer>
  </body>
</html>
